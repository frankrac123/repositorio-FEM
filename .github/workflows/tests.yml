name: Pruebas FEM y optimizacion

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 pytest==9.1.1
      - name: Run tests without opening SAP2000
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
